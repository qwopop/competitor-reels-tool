# Deploy stage, reusable: deploy one image from GHCR to the dev service on Render.
#
#   ci.yml (job `deploy-dev`, push to main)            ->  this workflow
#   deploy-dev-branch.yml (started by hand, any branch) ->  this workflow
#
# Always runs in the GitHub Environment `dev`; nothing here can reach `prod`
# (promotion is promote.yml). The caller passes the image and tag that build-image.yml
# produced. The Environment `dev` needs (Settings -> Environments -> dev):
#   secret   RENDER_DEPLOY_HOOK_URL   the clipremix-dev service's Deploy Hook
#   variable RENDER_APP_URL           the dev site's address
# Without them the job is skipped with a notice (docs/deploy.md).
#
# After the deploy, job `smoke` runs the @smoke Playwright subset (e2e/tests/smoke.spec.ts)
# against the dev site and records the result as the commit status `dev-smoke` on the image's
# commit. promote.yml refuses an image without a successful dev-smoke (#86). The caller must
# grant `statuses: write`. Tags that are not YYYYMMDD-HHMMSS-shortsha (the bug build) skip it.
name: Deploy image to dev

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, ghcr.io/<owner>/clipremix
        type: string
        required: true
      tag:
        description: Image tag, YYYYMMDD-HHMMSS-shortsha (bugtest- prefix for the bug build)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to dev (Render)
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      ready: ${{ steps.settings.outputs.ready }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.RENDER_APP_URL }}
      IMAGE: ${{ inputs.image }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the deploy settings
        id: settings
        run: |
          missing=""
          [ -z "$DEPLOY_HOOK" ] && missing="the RENDER_DEPLOY_HOOK_URL secret"
          if [ -z "$APP_URL" ]; then
            [ -n "$missing" ] && missing="$missing and "
            missing="${missing}the RENDER_APP_URL variable"
          fi
          if [ -n "$missing" ]; then
            echo "::notice::Deploy to dev skipped: set $missing in the dev environment (docs/deploy.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the deploy of this image
        if: steps.settings.outputs.ready == 'true'
        run: |
          # imgURL makes Render pull exactly this image. The URL is never printed.
          img=$(printf '%s' "$IMAGE:$TAG" | jq -sRr @uri)
          case "$DEPLOY_HOOK" in
            *\?*) url="${DEPLOY_HOOK}&imgURL=${img}" ;;
            *)    url="${DEPLOY_HOOK}?imgURL=${img}" ;;
          esac
          # curl's own error output is discarded because it can contain the URL.
          curl -fsS -o /dev/null -X POST "$url" 2>/dev/null \
            || { echo "::error::The deploy hook call failed (check the RENDER_DEPLOY_HOOK_URL secret)."; exit 1; }

      - name: Wait until the new version is live and healthy
        if: steps.settings.outputs.ready == 'true'
        run: |
          # /api/health must report this image tag, environment dev and a working database.
          # Render pulls the image and may wake from sleep, so allow up to 20 minutes.
          for attempt in $(seq 1 80); do
            body=$(curl -fsS --max-time 10 "${APP_URL%/}/api/health" || true)
            echo "[$attempt] $body"
            if echo "$body" | grep -q "\"version\":\"$TAG\"" \
              && echo "$body" | grep -q '"environment":"dev"' \
              && echo "$body" | grep -q '"database":"ok"'; then
              echo "Deployed $IMAGE:$TAG to dev and healthy."
              echo "Deployed \`$IMAGE:$TAG\` to dev; it reports that version and a working database." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::The new version did not become healthy on dev within 20 minutes. Check the deploy log in Render."
          exit 1

  smoke:
    name: Smoke tests on dev
    needs: deploy
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      statuses: write
    # Same group as the deploy: no new deploy replaces the version while it is being tested.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      APP_URL: ${{ vars.RENDER_APP_URL }}
      DEPLOYED: ${{ needs.deploy.outputs.ready }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Decide whether to run
        id: gate
        run: |
          if [ "$DEPLOYED" != "true" ] || [ -z "$APP_URL" ]; then
            echo "::notice::Smoke tests on dev skipped: the dev settings do not exist yet, so nothing was deployed (docs/deploy.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif ! echo "$TAG" | grep -Eq '^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$'; then
            echo "::notice::Smoke tests skipped: $TAG is not a promotable image tag (for example the bug build), so no dev-smoke status is recorded."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Mark the image as being smoke tested
        id: sha
        if: steps.gate.outputs.run == 'true'
        run: |
          full=$(gh api "repos/$REPO/commits/${TAG##*-}" --jq .sha)
          echo "full=$full" >> "$GITHUB_OUTPUT"
          SHA="$full" STATE=pending TARGET_URL="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" \
            bash scripts/smoke/record_status.sh

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        if: steps.gate.outputs.run == 'true'
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke tests against dev
        id: smoke
        if: steps.gate.outputs.run == 'true'
        working-directory: e2e
        env:
          BASE_URL: ${{ vars.RENDER_APP_URL }}
          EXPECT_VERSION: ${{ inputs.tag }}
          EXPECT_ENVIRONMENT: dev
        # A free dev service may still be waking up: the first request can take a minute.
        run: |
          curl -fsS --max-time 120 -o /dev/null "${BASE_URL%/}/api/health" || true
          npm run smoke

      - name: Record the result
        # Runs after a failure too. A cancelled run leaves the status pending, which promote refuses.
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          case "${{ steps.smoke.outcome }}" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          SHA="${{ steps.sha.outputs.full }}" STATE="$state" TARGET_URL="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" \
            bash scripts/smoke/record_status.sh
          echo "Smoke tests on dev for \`$TAG\`: $state (commit status \`dev-smoke\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Playwright report
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
