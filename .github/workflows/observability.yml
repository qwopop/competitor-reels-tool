# Proves the telemetry chain end to end on a runner that has Docker:
#   backend (OTLP) -> Collector -> Prometheus / Loki / Tempo -> Grafana
# observability/smoke.py drives the API, queries all four, asserts the metrics, labels,
# logs and a trace, and writes the observed names to the job summary and an artifact.
# observability/explore.cjs then opens Grafana Explore in a browser (Playwright) and checks the
# trace, the log lines and every metric there, filtered by environment and version.
name: Observability smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - observability/**
      - backend/app/**
      - backend/uv.lock
      - .github/workflows/observability.yml
      - docs/runbook.md

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Stack and app, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Start the observability stack
        run: docker compose -f observability/docker-compose.yaml up -d --wait

      - name: Start the backend with OTLP export to the Collector
        working-directory: backend
        env:
          VIDEO_SOURCE: sample
          DATABASE_URL: sqlite:///./data/smoke.db
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_METRIC_EXPORT_INTERVAL: "5000"
          OTEL_BSP_SCHEDULE_DELAY: "1000"
          OTEL_BLRP_SCHEDULE_DELAY: "1000"
        run: |
          uv sync --frozen
          nohup uv run uvicorn app.main:app --port 8091 > ../app.log 2>&1 &

      - name: Smoke test
        run: python3 -I observability/smoke.py --out observability-results --version "$APP_VERSION"

      # The manual check, done by a browser: open Grafana Explore and look at the trace, the
      # log lines and each metric, filtered by environment and version.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Look at the signals in Grafana Explore (real browser)
        run: NODE_PATH="$PWD/e2e/node_modules" node observability/explore.cjs --env "$APP_ENV" --version "$APP_VERSION" --out observability-results/explore

      - name: Logs of the app and the stack
        if: failure()
        run: |
          echo "::group::app"; cat app.log || true; echo "::endgroup::"
          docker compose -f observability/docker-compose.yaml logs --no-color otel-collector prometheus loki tempo grafana || true

      - name: Upload the raw query results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-results
          path: |
            observability-results
            app.log
          if-no-files-found: warn

      - name: Stop the stack
        if: always()
        run: docker compose -f observability/docker-compose.yaml down -v

  # #81: apply the dashboard and the alert rule to the local Grafana with apply.py and check them
  # through Grafana's HTTP API. observability/grafana/verify.py also sends SYNTHETIC remix failures
  # over OTLP (not produced by the app) to make the rule fire, and records the alert API output.
  grafana:
    name: Dashboard and alert rule in the local Grafana
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: dev
      APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"

      - name: Start the observability stack
        run: docker compose -f observability/docker-compose.yaml up -d --wait

      - name: Start the backend with OTLP export to the Collector
        working-directory: backend
        env:
          VIDEO_SOURCE: sample
          DATABASE_URL: sqlite:///./data/grafana.db
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_METRIC_EXPORT_INTERVAL: "5000"
          OTEL_BSP_SCHEDULE_DELAY: "1000"
          OTEL_BLRP_SCHEDULE_DELAY: "1000"
        run: |
          uv sync --frozen
          nohup uv run uvicorn app.main:app --port 8091 > ../app.log 2>&1 &

      - name: Click through the app (real metrics, no failures)
        run: python3 -I observability/smoke.py --out smoke-results --version "$APP_VERSION"

      - name: Apply the dashboard and alert rule, check them, make the rule fire with synthetic data
        run: python3 -I observability/grafana/verify.py --out grafana-results --version "$APP_VERSION"

      - name: Logs of the stack
        if: failure()
        run: docker compose -f observability/docker-compose.yaml logs --no-color grafana prometheus otel-collector | tail -n 300

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-results
          path: |
            grafana-results
            smoke-results
            app.log
          if-no-files-found: warn

      - name: Stop the stack
        if: always()
        run: docker compose -f observability/docker-compose.yaml down -v
