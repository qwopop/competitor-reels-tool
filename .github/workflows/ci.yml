# CI/CD: test everything on every push and pull request; deploy main to dev.
#
#   backend ─┐
#            ├─> stack (compose: integration + end-to-end) ─> image ─> deploy-dev
#   frontend ┘                                              (main only: build once, push to GHCR, deploy that image)
#
# `image` (build-image.yml) pushes ghcr.io/<owner>/clipremix:YYYYMMDD-HHMMSS-shortsha
# with the GITHUB_TOKEN; no secret. Render pulls that image, it never builds.
# deploy-dev (deploy-dev.yml, shared with deploy-dev-branch.yml) uses the GitHub Environment `dev`, which needs (Settings → Environments → dev):
#   secret   RENDER_DEPLOY_HOOK_URL   the clipremix-dev service's Deploy Hook (Render → Settings)
#   variable RENDER_APP_URL           the dev site's address, e.g. https://clipremix-dev.onrender.com
# Without them the job is skipped with a notice. No job here uses the `prod`
# environment: a push to main never touches prod. See docs/deploy.md.
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through a deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests (SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clipremix
          POSTGRES_PASSWORD: clipremix
          POSTGRES_DB: clipremix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipremix -d clipremix"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Validate the observability Compose file
        working-directory: .
        run: docker compose -f observability/docker-compose.yaml config --quiet
      - name: Validate the Grafana dashboard and alert files (no secrets, no Grafana)
        working-directory: .
        run: python3 -I observability/grafana/apply.py --dry-run > /dev/null
      - run: uv sync --frozen
      - name: Tests on SQLite
        run: uv run pytest -q
      - name: On-call engineer tests (fake agent, no network)
        run: uv run pytest ../on-call-engineer/tests -q
      - name: Smoke gate and status recorder tests (mock gh, no network)
        run: uv run pytest ../scripts/smoke/tests -q
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://clipremix:clipremix@localhost:5432/clipremix
        run: uv run pytest -q

  frontend:
    name: Frontend tests, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    name: Integration and end-to-end tests (Docker Compose)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:8100
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build and start the stack (app + PostgreSQL, sample videos)
        env:
          VIDEO_SOURCE: sample
          APP_VERSION: ${{ github.sha }}
        run: docker compose up -d --build --wait

      - name: Integration tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run pytest ../integration -q

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: e2e
        run: npx playwright test

      # The same subset deploy-dev.yml runs against dev, proven here on a real stack.
      - name: Smoke subset (as run against dev)
        working-directory: e2e
        env:
          EXPECT_VERSION: ${{ github.sha }}
          EXPECT_ENVIRONMENT: local
        run: npm run smoke

      - name: App logs
        if: failure()
        run: docker compose logs --no-color app db
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  image:
    name: Build and push the image (GHCR)
    needs: stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml

  deploy-dev:
    name: Deploy to dev (Render)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/deploy-dev.yml
    with:
      image: ${{ needs.image.outputs.image }}
      tag: ${{ needs.image.outputs.tag }}
