# Publishes a no-backend demo of the frontend to GitHub Pages.
# The demo uses the in-browser mock API, so data lives in each visitor's browser.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [claude/eloquent-pasteur-sgl8v0, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build demo
        working-directory: frontend
        env:
          VITE_USE_MOCK: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          # GitHub Pages has no SPA fallback, so unknown routes such as /content-plan load this page.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
