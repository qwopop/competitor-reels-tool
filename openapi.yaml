openapi: 3.1.0
info:
  title: Competitor Videos API
  version: 0.1.0
  description: >
    Contract between the React frontend (frontend/) and the FastAPI backend
    (backend/). Mirrors the VideosApi service interface in frontend/src/types.ts.
servers:
  - url: http://localhost:8091
    description: Local development server

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Is the app up, and can it reach its database?
      description: >
        Used by Docker, Render and CI. `version` is the deployed git commit
        (APP_VERSION, then RENDER_GIT_COMMIT, then `dev`). `environment` is
        APP_ENV: `dev`, `prod` or `local`.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/competitors:
    get:
      operationId: listCompetitors
      summary: List tracked competitors, newest first
      responses:
        "200":
          description: Competitors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competitor"
    post:
      operationId: addCompetitor
      summary: Track a competitor from a YouTube channel link, @handle or video link
      description: >
        The server looks the channel up on YouTube to get its ID, name and avatar.
        If the channel is already tracked, the existing competitor is returned
        with status 200 instead of creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCompetitorRequest"
      responses:
        "201":
          description: Competitor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
        "200":
          description: Competitor already tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"

  /api/competitors/{competitor_id}:
    parameters:
      - $ref: "#/components/parameters/CompetitorId"
    delete:
      operationId: removeCompetitor
      summary: Stop tracking a competitor and delete its Videos
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/Error"

  /api/competitors/{competitor_id}/videos/fetch:
    parameters:
      - $ref: "#/components/parameters/CompetitorId"
    post:
      operationId: fetchVideosForCompetitor
      summary: Fetch the latest videos (up to 15) for a competitor
      description: >
        Videos come from the channel's public YouTube feed, which needs no API
        key. With VIDEO_SOURCE=sample on the server, sample videos are generated
        instead. If YouTube fails (network error, channel gone, no videos), the
        response is 502 and the stored videos are left as they were.
        Stores the new videos for this competitor and removes the old ones, with one
        exception: a Video that has a remix or a content plan item is kept, so a
        re-fetch never destroys the user's work. The library can therefore hold
        more than 15 videos for a competitor. The response lists only the new Videos.
      responses:
        "200":
          description: The freshly fetched Videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"

  /api/videos:
    get:
      operationId: listVideos
      summary: List all stored Videos, most recently posted first
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"

  /api/videos/{video_id}:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    get:
      operationId: getVideo
      summary: Get one Video
      responses:
        "200":
          description: Video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          $ref: "#/components/responses/Error"

  /api/videos/{video_id}/remix:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    post:
      operationId: remixVideo
      summary: Generate a breakdown (title, hook, script, CTA) for a Video from a template
      description: >
        Returns the existing remix with status 200 if one was already generated
        for this Video, otherwise generates a new one from the chosen template
        (default: default) and returns it with 201.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemixRequest"
      responses:
        "201":
          description: Remix generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "200":
          description: Existing remix returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "404":
          $ref: "#/components/responses/Error"

  /api/remixes/{remix_id}:
    parameters:
      - $ref: "#/components/parameters/RemixId"
    get:
      operationId: getRemix
      summary: Get one remix
      responses:
        "200":
          description: Remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateRemix
      summary: Edit the title, hook, script, or CTA of a remix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRemixRequest"
      responses:
        "200":
          description: Updated remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "404":
          $ref: "#/components/responses/Error"

  /api/videos/{video_id}/remix/current:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    get:
      operationId: getRemixForVideo
      summary: Get the remix that already exists for a Video
      responses:
        "200":
          description: Remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "404":
          $ref: "#/components/responses/Error"

  /api/remixes:
    get:
      operationId: listRemixes
      summary: List all remixes, most recently updated first
      responses:
        "200":
          description: Remixes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemixedVideo"

  /api/remixes/{remix_id}/apply-template:
    parameters:
      - $ref: "#/components/parameters/RemixId"
    post:
      operationId: applyRemixTemplate
      summary: Replace a remix's title, hook, script and CTA with a template's text
      description: >
        Overwrites the four text fields. The client should confirm first when
        the user has unsaved edits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemixRequest"
      responses:
        "200":
          description: Updated remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "404":
          $ref: "#/components/responses/Error"

  /api/remixes/{remix_id}/ai-draft:
    parameters:
      - $ref: "#/components/parameters/RemixId"
    post:
      operationId: writeRemixWithAi
      summary: Ask Gemini for a draft title, hook, script and CTA in a creator voice
      description: >
        Gemini writes a draft from the source video's title, description, channel,
        numbers and format (Short or long video), in the chosen voice. The draft is
        returned only: nothing is saved (the remix and its updatedAt are unchanged).
        The client fills the editor with it and saves through PATCH /api/remixes/{remix_id}.
        The server first asks GEMINI_MODEL (default gemini-3.5-flash) and, when it
        answers 404, 429, 5xx, times out or returns an invalid answer, retries once
        with gemini-3.1-flash-lite. The templates keep working without Gemini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiDraftRequest"
      responses:
        "200":
          description: Draft written (not saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiDraft"
        "404":
          description: Remix not found, or its source video no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Invalid request: unknown voice, voice custom with an empty customVoice,
            customVoice over 300 or instructions over 500 characters. Nothing is sent to Gemini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Gemini's quota is used up (every model tried answered 429)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Gemini's free quota is used up for now. Try again later, or use a template.
        "502":
          description: >
            Gemini failed (5xx, timeout, network error, invalid answer, or the key
            was rejected). The editor text should stay as it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Gemini couldn't write a draft this time. Your text hasn't changed. Try again.
        "503":
          description: AI writing is not configured (GEMINI_API_KEY is not set on the server)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: AI writing is not set up on this server. Ask the owner to set GEMINI_API_KEY. Templates still work.

  /api/content-plan:
    get:
      operationId: listContentPlan
      summary: List the Videos in the content plan, most recently added first
      responses:
        "200":
          description: Content plan items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentPlanItem"
    post:
      operationId: addToContentPlan
      summary: Add a Video to the content plan
      description: >
        New items start as not_started. If the Video is already in the plan, the
        existing item is returned with status 200 instead of creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToPlanRequest"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlanItem"
        "200":
          description: Video already in the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlanItem"
        "404":
          $ref: "#/components/responses/Error"

  /api/content-plan/{plan_item_id}:
    parameters:
      - $ref: "#/components/parameters/PlanItemId"
    patch:
      operationId: updateContentPlanItem
      summary: Change a plan item's status, film/publish dates or checklist
      description: >
        Only the fields sent are changed. Send filmDate or publishDate as null to
        unschedule. An empty body, an invalid date or an unknown field is a 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanItemRequest"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlanItem"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeFromContentPlan
      summary: Remove a Video from the content plan
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/Error"

components:
  parameters:
    CompetitorId:
      name: competitor_id
      in: path
      required: true
      schema:
        type: string
    VideoId:
      name: video_id
      in: path
      required: true
      schema:
        type: string
    RemixId:
      name: remix_id
      in: path
      required: true
      schema:
        type: string

    PlanItemId:
      name: plan_item_id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Health:
      type: object
      required: [status, database, version, environment]
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: ok
        version:
          type: string
          description: Deployed git commit, or `dev` when unknown.
          example: 4d32956
        environment:
          type: string
          description: The APP_ENV the app runs as.
          enum: [dev, prod, local]
          example: dev
    Competitor:
      type: object
      required: [id, channelId, username, channelUrl, displayName, avatarUrl, addedAt]
      properties:
        id: { type: string }
        channelId:
          type: string
          description: YouTube channel ID (UC...). Sample channels use sample-<name>.
        username:
          type: string
          description: The @handle without the @, lowercase, or the channel ID when there is none.
        channelUrl: { type: string, format: uri }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
        addedAt: { type: string, format: date-time }

    AddCompetitorRequest:
      type: object
      required: [channelUrl]
      properties:
        channelUrl:
          type: string
          maxLength: 2048
          description: >
            A YouTube channel link (/@handle, /channel/UC..., /c/name, /user/name,
            with or without https:// and www.), an @handle, a channel ID, or a
            link to one of the channel's videos (watch?v=, youtu.be/, /shorts/).
            Other links are rejected with HTTP 400.
          examples: ["https://www.youtube.com/@mkbhd"]

    Video:
      type: object
      required:
        [id, competitorId, competitorUsername, youtubeId, permalink, caption,
         thumbnailUrl, viewCount, likeCount, commentCount, postedAt, fetchedAt]
      properties:
        id: { type: string }
        competitorId: { type: string }
        competitorUsername: { type: string }
        youtubeId:
          type: string
          description: YouTube's 11-character video ID (sample videos use generated values)
        permalink:
          type: string
          format: uri
          description: >
            Link to the video itself, e.g. https://www.youtube.com/watch?v=<youtubeId>
            or /shorts/<youtubeId>. Sample videos have no real page and link to the channel.
        viewCount:
          type: integer
          minimum: 0
          description: 0 when unknown.
        caption: { type: string, description: The video title }
        description:
          type: string
          description: >
            The video's YouTube description (may be empty). The remix writer reads
            its sentences, chapter list and offers to personalise the draft.
        thumbnailUrl: { type: string, format: uri }
        likeCount: { type: integer, minimum: 0 }
        commentCount:
          type: integer
          minimum: 0
          description: 0 for real videos; YouTube's channel feed has no comment counts.
        postedAt: { type: string, format: date-time }
        fetchedAt: { type: string, format: date-time }

    RemixedVideo:
      type: object
      required: [id, videoId, title, hook, script, cta, createdAt, updatedAt]
      properties:
        id: { type: string }
        videoId: { type: string }
        title: { type: string }
        hook: { type: string }
        script: { type: string }
        cta: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RemixTemplate:
      type: string
      description: >
        default, educational, storytelling or promotional. Each writes a draft
        from the video's own title, description (sentences, chapters, offers),
        channel name, view count and format (Short or long video). No AI model.
      enum: [default, educational, storytelling, promotional]

    RemixRequest:
      type: object
      additionalProperties: false
      properties:
        template:
          $ref: "#/components/schemas/RemixTemplate"

    UpdateRemixRequest:
      type: object
      description: Only the provided fields are changed. Longer values return HTTP 422.
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 500 }
        hook: { type: string, maxLength: 1000 }
        script: { type: string, maxLength: 2000 }
        cta: { type: string, maxLength: 500 }

    CreatorVoice:
      type: string
      description: >
        A preset persona for the AI writer, or custom (then customVoice describes it).
      enum: [educational_blogger, storyteller, entertainer, expert_reviewer, motivational_coach, custom]

    AiDraftRequest:
      type: object
      required: [voice]
      additionalProperties: false
      properties:
        voice:
          $ref: "#/components/schemas/CreatorVoice"
        customVoice:
          type: string
          maxLength: 300
          description: >
            Who is speaking, in the owner's words ("You are a calm finance coach…").
            Required and not blank when voice is custom; ignored for a preset voice.
        instructions:
          type: string
          maxLength: 500
          description: Optional extra instructions ("Keep it under 45 seconds.").

    AiDraft:
      type: object
      description: >
        A draft written by Gemini. Not a saved remix: it has no id or timestamps.
        Fields longer than the limits of UpdateRemixRequest are cut to them.
      required: [title, hook, script, cta, model]
      properties:
        title: { type: string, maxLength: 500 }
        hook: { type: string, maxLength: 1000 }
        script:
          type: string
          maxLength: 2000
          description: >
            Numbered beats as the templates write them: "1. …" lines for long videos,
            time-marked lines ("0–3s · …", ending with "Last 5s · CTA") for Shorts.
        cta: { type: string, maxLength: 500 }
        model:
          type: string
          description: The Gemini model that answered.
          example: gemini-3.5-flash

    PlanStatus:
      type: string
      description: >
        not_started: nothing ready yet (❌). ready: script is done and the video
        is ready to film (⏳). filmed: filmed and posted (✅).
      enum: [not_started, ready, filmed]

    ContentPlanItem:
      type: object
      required: [id, videoId, status, competitorUsername, caption, thumbnailUrl, permalink, postedAt, addedAt, updatedAt,
                 filmDate, publishDate, scriptDone, recordingDone, captionDone, publishedDone]
      properties:
        id: { type: string }
        videoId: { type: string, description: The Video this item was added from }
        status: { $ref: "#/components/schemas/PlanStatus" }
        competitorUsername: { type: string }
        caption: { type: string }
        thumbnailUrl: { type: string, format: uri }
        permalink: { type: string, format: uri }
        postedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        filmDate:
          type: [string, "null"]
          format: date
          description: The day to film (YYYY-MM-DD), or null when not scheduled.
        publishDate:
          type: [string, "null"]
          format: date
          description: The day to publish (YYYY-MM-DD), or null when not scheduled.
        scriptDone: { type: boolean, description: "Checklist: script completed" }
        recordingDone: { type: boolean, description: "Checklist: recording completed" }
        captionDone: { type: boolean, description: "Checklist: caption prepared" }
        publishedDone: { type: boolean, description: "Checklist: published" }

    AddToPlanRequest:
      type: object
      required: [videoId]
      properties:
        videoId: { type: string }

    UpdatePlanItemRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/PlanStatus" }
        filmDate: { type: [string, "null"], format: date }
        publishDate: { type: [string, "null"], format: date }
        scriptDone: { type: boolean }
        recordingDone: { type: boolean }
        captionDone: { type: boolean }
        publishedDone: { type: boolean }

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Human-readable error message shown in the UI
