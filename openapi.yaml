openapi: 3.1.0
info:
  title: Competitor Videos API
  version: 0.1.0
  description: >
    Contract between the React frontend (frontend/) and the FastAPI backend
    (backend/). Mirrors the VideosApi service interface in frontend/src/types.ts.
servers:
  - url: http://localhost:8091
    description: Local development server

paths:
  /api/competitors:
    get:
      operationId: listCompetitors
      summary: List tracked competitors, newest first
      responses:
        "200":
          description: Competitors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competitor"
    post:
      operationId: addCompetitor
      summary: Track a competitor from an Instagram profile URL or @username
      description: >
        If the username is already tracked, the existing competitor is returned
        with status 200 instead of creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCompetitorRequest"
      responses:
        "201":
          description: Competitor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
        "200":
          description: Competitor already tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
        "400":
          $ref: "#/components/responses/Error"

  /api/competitors/{competitor_id}:
    parameters:
      - $ref: "#/components/parameters/CompetitorId"
    delete:
      operationId: removeCompetitor
      summary: Stop tracking a competitor and delete its Videos
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/Error"

  /api/competitors/{competitor_id}/videos/fetch:
    parameters:
      - $ref: "#/components/parameters/CompetitorId"
    post:
      operationId: fetchVideosForCompetitor
      summary: Fetch the 20 most recent Videos for a competitor
      description: >
        Real Videos come from the Instagram Graph API when the server has
        INSTAGRAM_ACCESS_TOKEN and INSTAGRAM_USER_ID set; otherwise sample Videos
        are generated. If Instagram fails (account is not a public Business or
        Creator account, expired token, rate limit, no Videos), the response is
        502 and the stored Videos are left as they were.
        Stores 20 new Videos for this competitor and removes the old ones, with one
        exception: a Video that has a remix or a content plan item is kept, so a
        re-fetch never destroys the user's work. The library can therefore hold
        more than 20 Videos for a competitor. The response lists only the new Videos.
      responses:
        "200":
          description: The freshly fetched Videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"

  /api/videos:
    get:
      operationId: listVideos
      summary: List all stored Videos, most recently posted first
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"

  /api/videos/{video_id}:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    get:
      operationId: getVideo
      summary: Get one Video
      responses:
        "200":
          description: Video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          $ref: "#/components/responses/Error"

  /api/videos/{video_id}/remix:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    post:
      operationId: remixVideo
      summary: Generate a breakdown (title, hook, script, CTA) for a Video from a template
      description: >
        Returns the existing remix with status 200 if one was already generated
        for this Video, otherwise generates a new one from the chosen template
        (default: default) and returns it with 201.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemixRequest"
      responses:
        "201":
          description: Remix generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "200":
          description: Existing remix returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "404":
          $ref: "#/components/responses/Error"

  /api/remixes/{remix_id}:
    parameters:
      - $ref: "#/components/parameters/RemixId"
    get:
      operationId: getRemix
      summary: Get one remix
      responses:
        "200":
          description: Remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateRemix
      summary: Edit the title, hook, script, or CTA of a remix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRemixRequest"
      responses:
        "200":
          description: Updated remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "404":
          $ref: "#/components/responses/Error"

  /api/videos/{video_id}/remix/current:
    parameters:
      - $ref: "#/components/parameters/VideoId"
    get:
      operationId: getRemixForVideo
      summary: Get the remix that already exists for a Video
      responses:
        "200":
          description: Remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "404":
          $ref: "#/components/responses/Error"

  /api/remixes:
    get:
      operationId: listRemixes
      summary: List all remixes, most recently updated first
      responses:
        "200":
          description: Remixes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemixedVideo"

  /api/remixes/{remix_id}/apply-template:
    parameters:
      - $ref: "#/components/parameters/RemixId"
    post:
      operationId: applyRemixTemplate
      summary: Replace a remix's title, hook, script and CTA with a template's text
      description: >
        Overwrites the four text fields. The client should confirm first when
        the user has unsaved edits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemixRequest"
      responses:
        "200":
          description: Updated remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedVideo"
        "404":
          $ref: "#/components/responses/Error"

  /api/content-plan:
    get:
      operationId: listContentPlan
      summary: List the Videos in the content plan, most recently added first
      responses:
        "200":
          description: Content plan items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentPlanItem"
    post:
      operationId: addToContentPlan
      summary: Add a Video to the content plan
      description: >
        New items start as not_started. If the Video is already in the plan, the
        existing item is returned with status 200 instead of creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToPlanRequest"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlanItem"
        "200":
          description: Video already in the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlanItem"
        "404":
          $ref: "#/components/responses/Error"

  /api/content-plan/{plan_item_id}:
    parameters:
      - $ref: "#/components/parameters/PlanItemId"
    patch:
      operationId: updateContentPlanItem
      summary: Change the filming status of a plan item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanItemRequest"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlanItem"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeFromContentPlan
      summary: Remove a Video from the content plan
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/Error"

components:
  parameters:
    CompetitorId:
      name: competitor_id
      in: path
      required: true
      schema:
        type: string
    VideoId:
      name: video_id
      in: path
      required: true
      schema:
        type: string
    RemixId:
      name: remix_id
      in: path
      required: true
      schema:
        type: string

    PlanItemId:
      name: plan_item_id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Competitor:
      type: object
      required: [id, username, instagramUrl, displayName, avatarUrl, addedAt]
      properties:
        id: { type: string }
        username: { type: string }
        instagramUrl: { type: string, format: uri }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
        addedAt: { type: string, format: date-time }

    AddCompetitorRequest:
      type: object
      required: [instagramUrl]
      properties:
        instagramUrl:
          type: string
          maxLength: 2048
          description: >
            An Instagram profile link (with or without https:// and www.) or a bare
            username such as @vibecoder. Usernames are 1 to 30 characters of letters,
            digits, periods and underscores. Post, Video, Explore and other non-profile
            links are rejected with HTTP 400.
          examples: ["https://instagram.com/vibecoder"]

    Video:
      type: object
      required:
        [id, competitorId, competitorUsername, shortcode, permalink, caption,
         thumbnailUrl, viewCount, likeCount, commentCount, postedAt, fetchedAt]
      properties:
        id: { type: string }
        competitorId: { type: string }
        competitorUsername: { type: string }
        shortcode:
          type: string
          description: Instagram short code (sample Videos use generated values)
        permalink:
          type: string
          format: uri
          description: >
            Link to the Video itself, e.g. https://www.instagram.com/video/<shortcode>/.
            Sample Videos have no real post and link to the competitor's profile.
        viewCount:
          type: integer
          minimum: 0
          description: 0 when unknown; the Graph API does not report views for other accounts.
        caption: { type: string }
        thumbnailUrl: { type: string, format: uri }
        likeCount: { type: integer, minimum: 0 }
        commentCount: { type: integer, minimum: 0 }
        postedAt: { type: string, format: date-time }
        fetchedAt: { type: string, format: date-time }

    RemixedVideo:
      type: object
      required: [id, videoId, title, hook, script, cta, createdAt, updatedAt]
      properties:
        id: { type: string }
        videoId: { type: string }
        title: { type: string }
        hook: { type: string }
        script: { type: string }
        cta: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RemixTemplate:
      type: string
      description: >
        default, educational, storytelling or promotional. Each produces
        template-generated drafts from the Video's details, not AI analysis.
      enum: [default, educational, storytelling, promotional]

    RemixRequest:
      type: object
      additionalProperties: false
      properties:
        template:
          $ref: "#/components/schemas/RemixTemplate"

    UpdateRemixRequest:
      type: object
      description: Only the provided fields are changed. Longer values return HTTP 422.
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 500 }
        hook: { type: string, maxLength: 1000 }
        script: { type: string, maxLength: 2000 }
        cta: { type: string, maxLength: 500 }

    PlanStatus:
      type: string
      description: >
        not_started: nothing ready yet (❌). ready: script is done and the video
        is ready to film (⏳). filmed: filmed and posted (✅).
      enum: [not_started, ready, filmed]

    ContentPlanItem:
      type: object
      required: [id, videoId, status, competitorUsername, caption, thumbnailUrl, permalink, postedAt, addedAt, updatedAt]
      properties:
        id: { type: string }
        videoId: { type: string, description: The Video this item was added from }
        status: { $ref: "#/components/schemas/PlanStatus" }
        competitorUsername: { type: string }
        caption: { type: string }
        thumbnailUrl: { type: string, format: uri }
        permalink: { type: string, format: uri }
        postedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AddToPlanRequest:
      type: object
      required: [videoId]
      properties:
        videoId: { type: string }

    UpdatePlanItemRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/PlanStatus" }

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Human-readable error message shown in the UI
