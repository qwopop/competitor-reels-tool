openapi: 3.1.0
info:
  title: Competitor Reels API
  version: 0.1.0
  description: >
    Contract between the React frontend (frontend/) and the FastAPI backend
    (backend/). Mirrors the ReelsApi service interface in frontend/src/types.ts.
servers:
  - url: http://localhost:8091
    description: Local development server

paths:
  /api/competitors:
    get:
      operationId: listCompetitors
      summary: List tracked competitors, newest first
      responses:
        "200":
          description: Competitors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competitor"
    post:
      operationId: addCompetitor
      summary: Track a competitor from an Instagram profile URL or @username
      description: >
        If the username is already tracked, the existing competitor is returned
        with status 200 instead of creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCompetitorRequest"
      responses:
        "201":
          description: Competitor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
        "200":
          description: Competitor already tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competitor"
        "400":
          $ref: "#/components/responses/Error"

  /api/competitors/{competitor_id}:
    parameters:
      - $ref: "#/components/parameters/CompetitorId"
    delete:
      operationId: removeCompetitor
      summary: Stop tracking a competitor and delete its Reels
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/Error"

  /api/competitors/{competitor_id}/reels/fetch:
    parameters:
      - $ref: "#/components/parameters/CompetitorId"
    post:
      operationId: fetchReelsForCompetitor
      summary: Fetch the 20 most recent Reels for a competitor
      description: >
        Replaces any Reels previously stored for this competitor, so refetching
        never duplicates rows.
      responses:
        "200":
          description: The freshly fetched Reels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reel"
        "404":
          $ref: "#/components/responses/Error"

  /api/reels:
    get:
      operationId: listReels
      summary: List all stored Reels, most recently posted first
      responses:
        "200":
          description: Reels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reel"

  /api/reels/{reel_id}:
    parameters:
      - $ref: "#/components/parameters/ReelId"
    get:
      operationId: getReel
      summary: Get one Reel
      responses:
        "200":
          description: Reel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reel"
        "404":
          $ref: "#/components/responses/Error"

  /api/reels/{reel_id}/remix:
    parameters:
      - $ref: "#/components/parameters/ReelId"
    post:
      operationId: remixReel
      summary: Generate a breakdown (title, hook, script, CTA) for a Reel from a template
      description: >
        Returns the existing remix with status 200 if one was already generated
        for this Reel, otherwise generates a new one from the chosen template
        (default: default) and returns it with 201.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemixRequest"
      responses:
        "201":
          description: Remix generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedReel"
        "200":
          description: Existing remix returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedReel"
        "404":
          $ref: "#/components/responses/Error"

  /api/remixes/{remix_id}:
    parameters:
      - $ref: "#/components/parameters/RemixId"
    get:
      operationId: getRemix
      summary: Get one remix
      responses:
        "200":
          description: Remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedReel"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateRemix
      summary: Edit the title, hook, script, or CTA of a remix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRemixRequest"
      responses:
        "200":
          description: Updated remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedReel"
        "404":
          $ref: "#/components/responses/Error"

  /api/reels/{reel_id}/remix/current:
    parameters:
      - $ref: "#/components/parameters/ReelId"
    get:
      operationId: getRemixForReel
      summary: Get the remix that already exists for a Reel
      responses:
        "200":
          description: Remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedReel"
        "404":
          $ref: "#/components/responses/Error"

  /api/remixes:
    get:
      operationId: listRemixes
      summary: List all remixes, most recently updated first
      responses:
        "200":
          description: Remixes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RemixedReel"

  /api/remixes/{remix_id}/apply-template:
    parameters:
      - $ref: "#/components/parameters/RemixId"
    post:
      operationId: applyRemixTemplate
      summary: Replace a remix's title, hook, script and CTA with a template's text
      description: >
        Overwrites the four text fields. The client should confirm first when
        the user has unsaved edits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemixRequest"
      responses:
        "200":
          description: Updated remix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemixedReel"
        "404":
          $ref: "#/components/responses/Error"

  /api/content-plan:
    get:
      operationId: listContentPlan
      summary: List the Reels in the content plan, most recently added first
      responses:
        "200":
          description: Content plan items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentPlanItem"
    post:
      operationId: addToContentPlan
      summary: Add a Reel to the content plan
      description: >
        New items start as not_started. If the Reel is already in the plan, the
        existing item is returned with status 200 instead of creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToPlanRequest"
      responses:
        "201":
          description: Item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlanItem"
        "200":
          description: Reel already in the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlanItem"
        "404":
          $ref: "#/components/responses/Error"

  /api/content-plan/{plan_item_id}:
    parameters:
      - $ref: "#/components/parameters/PlanItemId"
    patch:
      operationId: updateContentPlanItem
      summary: Change the filming status of a plan item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanItemRequest"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlanItem"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeFromContentPlan
      summary: Remove a Reel from the content plan
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/Error"

components:
  parameters:
    CompetitorId:
      name: competitor_id
      in: path
      required: true
      schema:
        type: string
    ReelId:
      name: reel_id
      in: path
      required: true
      schema:
        type: string
    RemixId:
      name: remix_id
      in: path
      required: true
      schema:
        type: string

    PlanItemId:
      name: plan_item_id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Competitor:
      type: object
      required: [id, username, instagramUrl, displayName, avatarUrl, addedAt]
      properties:
        id: { type: string }
        username: { type: string }
        instagramUrl: { type: string, format: uri }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri }
        addedAt: { type: string, format: date-time }

    AddCompetitorRequest:
      type: object
      required: [instagramUrl]
      properties:
        instagramUrl:
          type: string
          description: Instagram profile URL, or a bare username such as @vibecoder
          examples: ["https://instagram.com/vibecoder"]

    Reel:
      type: object
      required:
        [id, competitorId, competitorUsername, shortcode, permalink, caption,
         thumbnailUrl, viewCount, likeCount, commentCount, postedAt, fetchedAt]
      properties:
        id: { type: string }
        competitorId: { type: string }
        competitorUsername: { type: string }
        shortcode:
          type: string
          description: Instagram short code (sample Reels use generated values)
        permalink:
          type: string
          format: uri
          description: Link to the competitor's Instagram profile
        caption: { type: string }
        thumbnailUrl: { type: string, format: uri }
        viewCount: { type: integer, minimum: 0 }
        likeCount: { type: integer, minimum: 0 }
        commentCount: { type: integer, minimum: 0 }
        postedAt: { type: string, format: date-time }
        fetchedAt: { type: string, format: date-time }

    RemixedReel:
      type: object
      required: [id, reelId, title, hook, script, cta, createdAt, updatedAt]
      properties:
        id: { type: string }
        reelId: { type: string }
        title: { type: string }
        hook: { type: string }
        script: { type: string }
        cta: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RemixTemplate:
      type: string
      description: >
        default, educational, storytelling or promotional. Each produces
        template-generated drafts from the Reel's details, not AI analysis.
      enum: [default, educational, storytelling, promotional]

    RemixRequest:
      type: object
      additionalProperties: false
      properties:
        template:
          $ref: "#/components/schemas/RemixTemplate"

    UpdateRemixRequest:
      type: object
      description: Only the provided fields are changed.
      additionalProperties: false
      properties:
        title: { type: string }
        hook: { type: string }
        script: { type: string }
        cta: { type: string }

    PlanStatus:
      type: string
      description: >
        not_started: nothing ready yet (❌). ready: script is done and the video
        is ready to film (⏳). filmed: filmed and posted (✅).
      enum: [not_started, ready, filmed]

    ContentPlanItem:
      type: object
      required: [id, reelId, status, competitorUsername, caption, thumbnailUrl, permalink, postedAt, addedAt, updatedAt]
      properties:
        id: { type: string }
        reelId: { type: string, description: The Reel this item was added from }
        status: { $ref: "#/components/schemas/PlanStatus" }
        competitorUsername: { type: string }
        caption: { type: string }
        thumbnailUrl: { type: string, format: uri }
        permalink: { type: string, format: uri }
        postedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AddToPlanRequest:
      type: object
      required: [reelId]
      properties:
        reelId: { type: string }

    UpdatePlanItemRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/PlanStatus" }

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Human-readable error message shown in the UI
