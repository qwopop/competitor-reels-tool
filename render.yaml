# Render Blueprint: two independent copies of the app, dev and prod.
#
#   docker-compose.yaml        Render
#   app  (Dockerfile)    ->    clipremix-dev   web service, pulls ghcr.io/qwopop/clipremix
#                              clipremix-prod  web service, same image repository
#   db   (postgres:16)   ->    Neon (not Render): one project, branches `dev` and `prod`
#
# Render never builds: CI builds the image once and pushes it to GHCR with a
# timestamp tag; the Deploy Hook (imgURL=<image:tag>) tells Render which tag to
# pull. `image.url` is only the initial image; it is replaced by every deploy.
# The GHCR package must be Public so Render can pull without credentials.
#
# Each service gets its own Neon branch through DATABASE_URL, which the owner
# sets in Render (sync: false, so it is never stored in this file).
# See docs/deploy.md.

services:
  - type: web
    name: clipremix-dev
    runtime: image
    image:
      url: ghcr.io/qwopop/clipremix   # initial image only; deploys pass an exact tag (docs/deploy.md)
    region: frankfurt
    plan: free                    # sleeps when idle
    healthCheckPath: /api/health
    # Deploys are started by GitHub Actions only after every test passes and the
    # image is pushed (.github/workflows/ci.yml calls this service's Deploy Hook).
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: dev
      - key: DATABASE_URL         # Neon branch `dev`, with sslmode=require
        sync: false
      - key: VIDEO_SOURCE
        value: sample

  - type: web
    name: clipremix-prod
    runtime: image
    image:
      url: ghcr.io/qwopop/clipremix   # initial image only; deploys pass an exact tag (docs/deploy.md)
    region: frankfurt
    plan: free                    # sleeps when idle
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL         # Neon branch `prod`, with sslmode=require
        sync: false
      - key: VIDEO_SOURCE
        value: youtube
