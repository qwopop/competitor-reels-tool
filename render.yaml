# Render Blueprint: the same two services as docker-compose.yaml.
#
#   docker-compose.yaml        Render
#   app  (Dockerfile)    ->    clipremix     web service, built from the root Dockerfile
#   db   (postgres:16)   ->    clipremix-db  managed PostgreSQL 16
#
# Render doesn't run compose files; this blueprint describes the same setup.
# Create it once in Render (New → Blueprint). See docs/deploy.md.

services:
  - type: web
    name: clipremix
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free                    # sleeps when idle; use starter for an always-on site
    healthCheckPath: /api/health
    # Deploys are started by GitHub Actions only after every test passes
    # (.github/workflows/ci.yml calls this service's Deploy Hook).
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clipremix-db
          property: connectionString
      - key: VIDEO_SOURCE
        value: youtube

databases:
  - name: clipremix-db
    databaseName: clipremix
    user: clipremix
    region: frankfurt
    plan: free                    # expires after 30 days; use basic-256mb to keep it
    postgresMajorVersion: "16"
