# Render Blueprint: two independent copies of the app, dev and prod.
#
#   docker-compose.yaml        Render
#   app  (Dockerfile)    ->    clipremix-dev   web service, built from the root Dockerfile
#                              clipremix-prod  web service, same Dockerfile
#   db   (postgres:16)   ->    Neon (not Render): one project, branches `dev` and `prod`
#
# Each service gets its own Neon branch through DATABASE_URL, which the owner
# sets in Render (sync: false, so it is never stored in this file).
# See docs/deploy.md.

services:
  - type: web
    name: clipremix-dev
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    region: frankfurt
    plan: free                    # sleeps when idle
    healthCheckPath: /api/health
    # Deploys are started by GitHub Actions only after every test passes
    # (.github/workflows/ci.yml calls this service's Deploy Hook).
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: dev
      - key: DATABASE_URL         # Neon branch `dev`, with sslmode=require
        sync: false
      - key: VIDEO_SOURCE
        value: sample

  - type: web
    name: clipremix-prod
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    region: frankfurt
    plan: free                    # sleeps when idle
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL         # Neon branch `prod`, with sslmode=require
        sync: false
      - key: VIDEO_SOURCE
        value: youtube
