# Render Blueprint: backend API with a persistent SQLite disk, plus the frontend as a static site.
# Connect this repository in Render (New → Blueprint). See docs/deploy.md for the steps.
services:
  - type: web
    name: reels-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/competitors
    plan: starter            # persistent disks need a paid instance
    disk:
      name: reels-data
      mountPath: /app/data   # SQLite file: /app/data/app.db
      sizeGB: 1
    envVars:
      - key: CORS_ORIGINS
        sync: false          # set to the frontend URL, e.g. https://reels-web.onrender.com

  - type: web
    name: reels-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite        # client-side routes such as /content-plan load the app
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to the API URL plus /api, e.g. https://reels-api.onrender.com/api
